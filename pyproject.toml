[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motiondrop"
version = "0.1.0"
description = "Training-free motion-aware visual token compression for video-language models"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
authors = [{name = "MotionDrop Authors"}]
keywords = ["video", "vision-language-model", "token-compression", "inference"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "accelerate>=1.12,<2",
  "av>=14,<19",
  "decord2==3.4.0",
  "huggingface-hub>=1.3,<2",
  "httpx[socks]>=0.27,<1",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "protobuf>=5,<7",
  "safetensors>=0.5,<1",
  "sentencepiece>=0.2,<1",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "tqdm>=4.66,<5",
  "transformers==5.2.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9,<1",
]

[project.scripts]
motiondrop = "motiondrop.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
